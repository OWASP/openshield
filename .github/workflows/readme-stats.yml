name: README Stats Drift

# The website (Learn page included) computes its statistics at build time from
# website/src/lib/repoData.ts, so it never needs a commit. README.md is the one
# file that still states counts, and `dev` only accepts changes through pull
# requests, so this workflow never pushes: it reports drift as a warning and
# the fix lands in an ordinary PR (python .github/scripts/update_readme_stats.py).
on:
  push:
    branches: [dev]
    paths:
      - "scanner/rules/**"
      - "playbooks/cli/**"
      - "README.md"
      - ".github/scripts/update_readme_stats.py"
      - ".github/workflows/readme-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-stats:
    name: Check README statistics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Check README statistics
        run: |
          set +e
          output="$(python .github/scripts/update_readme_stats.py --check 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 3 ]; then
            # Stale counts are a docs follow-up, not a broken build.
            message="$(echo "$output" | tail -n 1)"
            echo "::warning title=README statistics are stale::${message}"
            {
              echo "### README statistics are stale"
              echo
              echo "${message}"
              echo
              echo "Open a PR with the output of \`python .github/scripts/update_readme_stats.py\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
